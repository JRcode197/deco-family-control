name: Deco Family Control
description: Profili, regole locali e inventario Deco X50 in sola lettura.
version: "0.5.0"
slug: deco_family_control
url: https://github.com/JRcode197/deco-family-control
arch:
  - amd64
  - aarch64
boot: manual
ingress: true
ingress_port: 8080
panel_icon: mdi:router-wireless
panel_admin: true
backup: cold
environment:
  DECO_HA_INGRESS: "true"
options:
  inventory_enabled: false
  deco_ip: "192.168.21.1"
  deco_username: "admin"
  deco_password: ""
  protected_macs: ""
  retention_days: 0
schema:
  inventory_enabled: bool
  deco_ip: str
  deco_username: str
  deco_password: "password?"
  protected_macs: str
  retention_days: int(0,3650)
